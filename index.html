<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><title>Vũ Thu Chi</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"></head><body><div class="app"><header><div><div class="eyebrow">VŨ THU CHI</div><h1>Quản lý tiền, <span>quản lý cuộc sống.</span></h1></div><button id="profile" class="icon-btn">V</button></header><main><section class="hero"><div><div class="muted">Số dư hiện tại</div><div id="balance" class="balance">16.500.000 ₫</div><div class="balance-note">+12% so với tháng trước</div></div><div class="hero-icon">₫</div></section><section class="stats"><div class="stat"><small>Tổng thu</small><strong id="income">45.000.000 ₫</strong></div><div class="stat"><small>Tổng chi</small><strong class="red" id="expense">28.500.000 ₫</strong></div></section><button id="addBtn" class="primary">＋ Thêm giao dịch</button><section class="card"><div class="section-title"><h2>Thu & Chi</h2><select id="period"><option>Tháng 9, 2026</option><option>Tháng 8, 2026</option></select></div><div class="bars" id="bars"></div><div class="legend"><span><i class="dot income-dot"></i> Thu</span><span><i class="dot expense-dot"></i> Chi</span></div></section><section class="card"><div class="section-title"><h2>Giao dịch gần đây</h2><button class="text-btn" id="viewAll">Xem tất cả</button></div><div id="transactions"></div></section></main><nav><button class="active">⌂<span>Trang chủ</span></button><button>▤<span>Giao dịch</span></button><button>⌁<span>Thống kê</span></button><button>▣<span>Danh mục</span></button><button>•••<span>Khác</span></button></nav></div><dialog id="dialog"><form method="dialog" id="txForm"><div class="dialog-head"><h2>Thêm giao dịch</h2><button value="cancel" class="close">×</button></div><div class="switch"><button type="button" class="selected" data-type="income">Thu</button><button type="button" data-type="expense">Chi</button></div><label>Số tiền<input id="amount" inputmode="numeric" placeholder="0" required></label><label>Danh mục<select id="category"><option>Lương</option><option>Forex</option><option>Trading</option><option>Phụ thu</option><option>Sinh hoạt</option><option>Mua sắm</option><option>Quà cáp</option><option>Đi lại</option></select></label><label>Ghi chú<input id="note" placeholder="Nhập ghi chú..."></label><button class="primary" value="default">Lưu giao dịch</button></form></dialog><script src="app.js"></script></body></html>

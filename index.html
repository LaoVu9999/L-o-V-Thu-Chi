<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Vũ Thu Chi</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"></head><body>
<div class="app"><header><div><small>QUẢN LÝ TÀI CHÍNH</small><h1>Vũ Thu Chi</h1></div><button id="reset">↻</button></header>
<nav id="books"><button data-book="personal" class="active">🏠 Cá nhân</button><button data-book="shop">🥖 Quán</button><button data-book="company">🏢 Doanh nghiệp</button></nav>
<section class="card"><span>Số dư <b id="bookName"></b></span><strong id="balance">0 ₫</strong><div class="stats"><div><small>Tổng thu</small><b id="income">0 ₫</b></div><div><small>Tổng chi</small><b id="expense">0 ₫</b></div></div></section>
<div class="actions"><button class="in" id="addIn">＋ Thu</button><button class="out" id="addOut">－ Chi</button><button class="transfer" id="transfer">↔ Chuyển nội bộ</button></div>
<section class="panel"><div class="head"><h2>Báo cáo</h2><select id="month"></select></div><div class="report"><div><span>Thu tháng</span><b id="mincome">0 ₫</b></div><div><span>Chi tháng</span><b id="mexpense">0 ₫</b></div><div><span>Chênh lệch</span><b id="mprofit">0 ₫</b></div></div><div class="bar"><i id="barIn"></i><i id="barOut"></i></div></section>
<section class="panel"><div class="head"><h2>Giao dịch</h2><select id="filter"><option value="all">Tất cả danh mục</option></select></div><div id="list"></div></section>
<section class="panel"><div class="head"><h2>Xuất dữ liệu</h2></div><p class="muted">Xuất sổ đang chọn hoặc toàn bộ dữ liệu thành Excel-compatible CSV.</p><div class="export"><button id="exportBook">📊 Xuất sổ này</button><button id="exportAll">📚 Xuất tất cả</button></div></section>
</div>
<div class="modal hidden" id="modal"><div class="sheet"><div class="sheettop"><h2 id="title">Thêm khoản</h2><button id="close">×</button></div><label>Số tiền<input id="amount" type="number" inputmode="decimal" placeholder="500000"></label><label>Danh mục<select id="category"></select></label><label>Ngày<input id="date" type="date"></label><label>Ghi chú<input id="note" placeholder="Không bắt buộc"></label><div id="transferFields" class="hidden"><label>Chuyển sang<select id="toBook"><option value="personal">🏠 Cá nhân</option><option value="shop">🥖 Quán</option><option value="company">🏢 Doanh nghiệp</option></select></label></div><button id="save" class="save">Lưu</button></div></div>
<script src="app.js"></script></body></html>
